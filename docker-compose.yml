services:
  postgres:
    image: postgres:16
    container_name: kairospayhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: kairos
      POSTGRES_DB: kairospayhub
    ports:
      - "5433:5432"
    volumes:
      - kairospayhub_pgdata:/var/lib/postgresql/data

volumes:
  kairospayhub_pgdata:
