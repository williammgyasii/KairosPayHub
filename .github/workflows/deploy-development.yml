name: Deploy to Development

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cloudflare/api/package-lock.json
            kairospayhub-frontend/package-lock.json

      - name: Configure Wrangler auth
        uses: ./.github/actions/wrangler-auth
        with:
          api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          refresh_token: ${{ secrets.CLOUDFLARE_WRANGLER_REFRESH_TOKEN }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install API worker dependencies
        working-directory: cloudflare/api
        run: npm ci

      - name: Deploy development gateway
        working-directory: cloudflare/api
        run: npx wrangler deploy --env development

      - name: Build development frontend
        working-directory: kairospayhub-frontend
        env:
          VITE_API_URL: https://dev.app.kairospayhub.com
        run: |
          npm ci
          npm run build

      - name: Deploy development frontend
        working-directory: kairospayhub-frontend
        run: npx wrangler pages deploy dist --project-name kairospayhub-frontend-dev --branch main
