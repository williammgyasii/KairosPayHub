# Tests on every PR/push. Dev deploy runs via deploy-development.yml after this workflow passes on main.
name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kairospayhub-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kairospayhub-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kairospayhub-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_API_URL: https://dev.api.kairospayhub.com
        run: npm run build
