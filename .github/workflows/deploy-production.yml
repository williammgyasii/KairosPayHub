name: Deploy to Production

on:
  push:
    tags:
      - v*

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cloudflare/api/package-lock.json
            kairospayhub-frontend/package-lock.json

      - name: Configure Wrangler auth
        uses: ./.github/actions/wrangler-auth
        with:
          api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          refresh_token: ${{ secrets.CLOUDFLARE_WRANGLER_REFRESH_TOKEN }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install API worker dependencies
        working-directory: cloudflare/api
        run: npm ci

      - name: Deploy production gateway
        working-directory: cloudflare/api
        run: npx wrangler deploy --env production

      - name: Build production frontend
        working-directory: kairospayhub-frontend
        env:
          VITE_API_URL: https://app.kairospayhub.com
        run: |
          npm ci
          npm run build

      - name: Deploy production frontend
        working-directory: kairospayhub-frontend
        run: npx wrangler pages deploy dist --project-name kairospayhub-frontend --branch main
