name: Sync Web Push secrets

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which Cloudflare environment to update
        type: choice
        options: [development, production, both]
        default: both

jobs:
  sync-development:
    if: inputs.target != 'production'
    runs-on: ubuntu-latest
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WEB_PUSH_PUBLIC_KEY: ${{ secrets.WEB_PUSH_PUBLIC_KEY }}
      WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
      WEB_PUSH_SUBJECT: ${{ secrets.WEB_PUSH_SUBJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/api/package-lock.json
      - uses: ./.github/actions/wrangler-auth
        with:
          api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          refresh_token: ${{ secrets.CLOUDFLARE_WRANGLER_REFRESH_TOKEN }}
      - name: Install API worker dependencies
        working-directory: cloudflare/api
        run: npm ci
      - uses: ./.github/actions/sync-web-push-secrets
        with:
          wrangler_env: development

  sync-production:
    if: inputs.target != 'development'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WEB_PUSH_PUBLIC_KEY: ${{ secrets.WEB_PUSH_PUBLIC_KEY }}
      WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
      WEB_PUSH_SUBJECT: ${{ secrets.WEB_PUSH_SUBJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/api/package-lock.json
      - uses: ./.github/actions/wrangler-auth
        with:
          api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          refresh_token: ${{ secrets.CLOUDFLARE_WRANGLER_REFRESH_TOKEN }}
      - name: Install API worker dependencies
        working-directory: cloudflare/api
        run: npm ci
      - uses: ./.github/actions/sync-web-push-secrets
        with:
          wrangler_env: production
