# KairosPayHub — single Blueprint, two environments
# Sync at https://dashboard.render.com/blueprints
#
# Deploy model (Option A):
#   main + CI green  → Development (autoDeployTrigger: checksPass, both services)
#   git tag v*       → Production (GitHub Actions deploy-production.yml + autoDeploy off)
#
# Dev services intentionally have NO buildFilter: if CI fails on a mixed
# frontend+API commit and later API-only fixes pass, the frontend must still
# redeploy from main so dev stays in sync.
#
# DNS (Cloudflare CNAME): app / api / dev.app / dev.api → Render hostnames
# Custom domains are already on the existing services; omit here so Blueprint
# adoption by service name does not fail with "domain already taken".
# Set sync:false secrets in dashboard after first sync: Jwt__SigningKey, Email__Smtp__*, R2__*

projects:
  - name: KairosPayHub
    environments:
      - name: Development
        services:
          - type: web
            name: kairospayhub-api-dev
            runtime: docker
            plan: starter
            region: ohio
            repo: https://github.com/williammgyasii/KairosPayHub
            branch: main
            rootDir: kairospayhub-api
            dockerfilePath: ./Dockerfile
            healthCheckPath: /health
            autoDeployTrigger: checksPass
            envVars:
              - key: ASPNETCORE_ENVIRONMENT
                value: Production
              - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
                value: "false"
              - key: ConnectionStrings__Default
                fromDatabase:
                  name: kairospayhub-db-dev
                  property: connectionString
              - key: Database__MigrateOnStartup
                value: "true"
              - key: Cors__Origins__0
                value: https://dev.app.kairospayhub.com
              - key: Cors__Origins__1
                value: http://127.0.0.1:5173
              - key: Jwt__Issuer
                value: https://dev.api.kairospayhub.com
              - key: Jwt__Audience
                value: kairospayhub-dev
              - key: Jwt__SigningKey
                sync: false
              - key: Email__FrontendBaseUrl
                value: https://dev.app.kairospayhub.com
              - key: Email__FromAddress
                sync: false
              - key: Email__FromName
                value: KairosPayHub (Dev)
              - key: Email__Smtp__Host
                sync: false
              - key: Email__Smtp__Port
                value: "587"
              - key: Email__Smtp__Username
                sync: false
              - key: Email__Smtp__Password
                sync: false
              - key: Email__Smtp__UseTls
                value: "true"
              - key: R2__BucketName
                value: kairospayhub-assets-dev
              - key: R2__PublicBaseUrl
                sync: false
              - key: R2__AccessKeyId
                sync: false
              - key: R2__SecretAccessKey
                sync: false
              - key: R2__Endpoint
                sync: false

          - type: web
            name: kairospayhub-frontend-dev
            runtime: static
            repo: https://github.com/williammgyasii/KairosPayHub
            branch: main
            rootDir: kairospayhub-frontend
            buildCommand: npm ci && npm test && npm run build
            staticPublishPath: ./dist
            autoDeployTrigger: checksPass
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            envVars:
              - key: VITE_API_URL
                value: https://dev.api.kairospayhub.com

        databases:
          - name: kairospayhub-db-dev
            plan: basic-256mb
            region: ohio
            postgresMajorVersion: "16"
            databaseName: kairospayhub_dev
            user: kairos_dev

      - name: Production
        permissions:
          protection: enabled
        services:
          - type: web
            name: kairospayhub-api
            runtime: docker
            plan: starter
            region: ohio
            repo: https://github.com/williammgyasii/KairosPayHub
            branch: main
            rootDir: kairospayhub-api
            dockerfilePath: ./Dockerfile
            healthCheckPath: /health
            autoDeployTrigger: "off"
            buildFilter:
              paths:
                - kairospayhub-api/**
            envVars:
              - key: ASPNETCORE_ENVIRONMENT
                value: Production
              - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
                value: "false"
              - key: ConnectionStrings__Default
                fromDatabase:
                  name: kairospayhub-db
                  property: connectionString
              - key: Database__MigrateOnStartup
                value: "true"
              - key: Cors__Origins__0
                value: https://app.kairospayhub.com
              - key: Cors__Origins__1
                value: http://localhost:5173
              - key: Jwt__Issuer
                value: https://api.kairospayhub.com
              - key: Jwt__Audience
                value: kairospayhub
              - key: Jwt__SigningKey
                sync: false
              - key: Email__FrontendBaseUrl
                value: https://app.kairospayhub.com
              - key: Email__FromAddress
                sync: false
              - key: Email__FromName
                value: KairosPayHub
              - key: Email__Smtp__Host
                sync: false
              - key: Email__Smtp__Port
                value: "587"
              - key: Email__Smtp__Username
                sync: false
              - key: Email__Smtp__Password
                sync: false
              - key: Email__Smtp__UseTls
                value: "true"
              - key: R2__BucketName
                value: kairospayhub-assets
              - key: R2__PublicBaseUrl
                sync: false
              - key: R2__AccessKeyId
                sync: false
              - key: R2__SecretAccessKey
                sync: false
              - key: R2__Endpoint
                sync: false

          - type: web
            name: kairospayhub-frontend
            runtime: static
            repo: https://github.com/williammgyasii/KairosPayHub
            branch: main
            rootDir: kairospayhub-frontend
            buildCommand: npm ci && npm test && npm run build
            staticPublishPath: ./dist
            autoDeployTrigger: "off"
            buildFilter:
              paths:
                - kairospayhub-frontend/**
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            envVars:
              - key: VITE_API_URL
                value: https://api.kairospayhub.com

        databases:
          - name: kairospayhub-db
            plan: basic-256mb
            region: ohio
            postgresMajorVersion: "16"
            databaseName: kairospayhub
            user: kairos
