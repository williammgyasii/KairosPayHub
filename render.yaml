# KairosPayHub on Render
# Connect repo at https://dashboard.render.com/blueprints
#
# After first sync, set sync:false env vars in the dashboard:
#   API: Jwt__SigningKey, Email__Smtp__*
#
# DNS: point app.kairospayhub.com and api.kairospayhub.com to Render
# (custom domains tab on each service).

services:
  - type: web
    name: kairospayhub-api
    runtime: docker
    plan: starter
    region: ohio
    repo: https://github.com/williammgyasii/KairosPayHub
    branch: main
    rootDir: kairospayhub-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    domains:
      - api.kairospayhub.com
    buildFilter:
      paths:
        - kairospayhub-api/**
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      - key: ConnectionStrings__Default
        fromDatabase:
          name: kairospayhub-db
          property: connectionString
      - key: Database__MigrateOnStartup
        value: "true"
      - key: Cors__Origins__0
        value: https://app.kairospayhub.com
      - key: Cors__Origins__1
        value: http://localhost:5173
      - key: Jwt__Issuer
        value: https://api.kairospayhub.com
      - key: Jwt__Audience
        value: kairospayhub
      - key: Jwt__SigningKey
        sync: false
      - key: Email__FrontendBaseUrl
        value: https://app.kairospayhub.com
      - key: Email__FromAddress
        sync: false
      - key: Email__FromName
        value: KairosPayHub
      - key: Email__Smtp__Host
        sync: false
      - key: Email__Smtp__Port
        value: "587"
      - key: Email__Smtp__Username
        sync: false
      - key: Email__Smtp__Password
        sync: false
      - key: Email__Smtp__UseTls
        value: "true"

  - type: web
    name: kairospayhub-frontend
    runtime: static
    plan: free
    region: ohio
    repo: https://github.com/williammgyasii/KairosPayHub
    branch: main
    rootDir: kairospayhub-frontend
    buildCommand: npm ci && npm test && npm run build
    staticPublishPath: ./dist
    domains:
      - app.kairospayhub.com
    buildFilter:
      paths:
        - kairospayhub-frontend/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://api.kairospayhub.com

databases:
  - name: kairospayhub-db
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "16"
    databaseName: kairospayhub
    user: kairos
