# KairosPayHub DEV on Render
# Connect as a second Blueprint: https://dashboard.render.com/blueprints
#
# Deploys from `develop` branch (create it from main if missing).
# DNS (Cloudflare): dev.app.kairospayhub.com, dev.api.kairospayhub.com
#
# After first sync, set sync:false env vars in the Render dashboard:
#   Jwt__SigningKey, Email__Smtp__*, R2__*

services:
  - type: web
    name: kairospayhub-api-dev
    runtime: docker
    plan: starter
    region: ohio
    repo: https://github.com/williammgyasii/KairosPayHub
    branch: develop
    rootDir: kairospayhub-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    domains:
      - dev.api.kairospayhub.com
    buildFilter:
      paths:
        - kairospayhub-api/**
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      - key: ConnectionStrings__Default
        fromDatabase:
          name: kairospayhub-db-dev
          property: connectionString
      - key: Database__MigrateOnStartup
        value: "true"
      - key: Cors__Origins__0
        value: https://dev.app.kairospayhub.com
      - key: Cors__Origins__1
        value: http://127.0.0.1:5173
      - key: Jwt__Issuer
        value: https://dev.api.kairospayhub.com
      - key: Jwt__Audience
        value: kairospayhub-dev
      - key: Jwt__SigningKey
        sync: false
      - key: Email__FrontendBaseUrl
        value: https://dev.app.kairospayhub.com
      - key: Email__FromAddress
        sync: false
      - key: Email__FromName
        value: KairosPayHub (Dev)
      - key: Email__Smtp__Host
        sync: false
      - key: Email__Smtp__Port
        value: "587"
      - key: Email__Smtp__Username
        sync: false
      - key: Email__Smtp__Password
        sync: false
      - key: Email__Smtp__UseTls
        value: "true"
      - key: R2__BucketName
        value: kairospayhub-assets-dev
      - key: R2__PublicBaseUrl
        sync: false
      - key: R2__AccessKeyId
        sync: false
      - key: R2__SecretAccessKey
        sync: false
      - key: R2__Endpoint
        sync: false

  - type: web
    name: kairospayhub-frontend-dev
    runtime: static
    plan: free
    region: ohio
    repo: https://github.com/williammgyasii/KairosPayHub
    branch: develop
    rootDir: kairospayhub-frontend
    buildCommand: npm ci && npm test && npm run build
    staticPublishPath: ./dist
    domains:
      - dev.app.kairospayhub.com
    buildFilter:
      paths:
        - kairospayhub-frontend/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://dev.api.kairospayhub.com

databases:
  - name: kairospayhub-db-dev
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "16"
    databaseName: kairospayhub_dev
    user: kairos_dev
